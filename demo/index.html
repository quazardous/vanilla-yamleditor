<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>vanilla-yamleditor playground</title>
    <style>
      body { margin: 0; font-family: system-ui, sans-serif; background: #f3f4f6; color: #111827; }
      main { max-width: 1100px; margin: 0 auto; padding: 1rem; display: grid; gap: 1rem; grid-template-columns: 1fr; }
      header { display: flex; flex-wrap: wrap; align-items: center; gap: 0.75rem; }
      h1 { font-size: 1.1rem; margin: 0; }
      #editor { height: 520px; }
      pre { margin: 0; padding: 0.75rem; background: #111827; color: #e5e7eb; border-radius: 6px; overflow: auto; max-height: 260px; font-size: 0.8rem; }
      .theme-dark { background: #030712; color: #e5e7eb; }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>vanilla-yamleditor</h1>
        <label><input type="checkbox" id="readonly" /> read only</label>
        <label><input type="checkbox" id="dark" /> dark</label>
        <button type="button" id="problem">Add a server problem</button>
      </header>
      <div id="editor"></div>
      <pre id="out"></pre>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
