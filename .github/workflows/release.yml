name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# id-token: npm Trusted Publishers (OIDC) and provenance, no NPM_TOKEN secret.
# Configured on npmjs.com: publisher = GitHub Actions, repo =
# quazardous/vanilla-yamleditor, workflow = release.yml.
permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Version PR or publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      # OIDC Trusted Publishing needs npm 11.5.1+; pinned to 11.x (npm 12's
      # `npm info --json` breaks @changesets/cli's published check).
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm run type-check
      - run: npm test
      - run: npm run build
      - name: Create release PR or publish
        uses: changesets/action@v1
        with:
          publish: npx changeset publish
          version: npx changeset version
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
