name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Versioning is local (npx changeset version, then a commit). A push whose
# version has no v<version> tag yet is a release: the npm pack tarball goes on
# a GitHub Release, and npm publish (OIDC Trusted Publishing, set on npmjs.com
# for this repo and release.yml), still allowed to fail until it has run once.
#
# id-token: npm Trusted Publishers (OIDC) and provenance, no NPM_TOKEN secret.
permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Tag, GitHub Release, npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Is this a release?
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      # OIDC Trusted Publishing needs npm 11.5.1+.
      - if: steps.version.outputs.release == 'true'
        run: npm install -g npm@11
      - if: steps.version.outputs.release == 'true'
        run: npm ci
      - if: steps.version.outputs.release == 'true'
        run: npm run type-check && npm test && npm run build

      - name: Tag and GitHub Release with the tarball
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tarball=$(npm pack --ignore-scripts | tail -1)
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/${tarball}"
          {
            awk -v v="## ${VERSION}" '$0 == v {on=1; next} /^## / && on {exit} on' CHANGELOG.md 2>/dev/null
            printf '\nInstall from npm, or from the attached tarball:\n\n```sh\nnpm install @quazardous/vanilla-yamleditor@%s\nnpm install %s\n```\n' "$VERSION" "$url"
          } > notes.md
          git tag "v${VERSION}"
          git push origin "v${VERSION}"
          gh release create "v${VERSION}" "$tarball" --verify-tag --title "v${VERSION}" --notes-file notes.md

      - name: npm publish (allowed to fail while the account cannot publish)
        if: steps.version.outputs.release == 'true'
        continue-on-error: true
        run: npm publish --ignore-scripts --provenance
